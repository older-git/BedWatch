# XcodeGen spec. Regenerate the project with: xcodegen generate
# Signing team and bundle ID prefix come from Config/Local.xcconfig (see Config/Base.xcconfig).
# The build number lives in Config/BuildNumber.xcconfig and is bumped by a scheme pre-action
# (Tools/bump-build-number.sh) on every build; watchOS ignores a re-installed complication
# extension whose build number didn't change.
name: BedWatch
options:
  deploymentTarget:
    watchOS: "10.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
schemes:
  BedWatch:
    build:
      targets:
        BedWatch: all
      preActions:
        - name: Bump build number
          script: '"$SRCROOT/Tools/bump-build-number.sh"'
          settingsTarget: BedWatch
    run:
      config: Debug
    archive:
      config: Release
packages:
  MCRProtocol:
    path: MCRProtocol
targets:
  BedWatch:
    type: application
    platform: watchOS
    sources: [WatchApp, Shared]
    dependencies:
      - package: MCRProtocol
        product: MCRProtocol
      - package: MCRProtocol
        product: MCRBluetooth
      - target: BedWatchWidgets
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: BedWatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKWatchOnly: true
        NSBluetoothAlwaysUsageDescription: BedWatch connects directly to your Sleep Number pump over Bluetooth to adjust the bed.
        NSLocationWhenInUseUsageDescription: Your location is used by the Temp + Humidity complication to show local weather (rounded to about 1 km and sent to open-meteo.com).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).BedWatch
        MARKETING_VERSION: "0.1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  BedWatchWidgets:
    type: app-extension
    platform: watchOS
    sources: [WidgetExtension, Shared]
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: BedWatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSWidgetWantsLocation: true
        NSLocationWhenInUseUsageDescription: Your location is used to show local weather (rounded to about 1 km and sent to open-meteo.com).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).BedWatch.widgets
        MARKETING_VERSION: "0.1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
